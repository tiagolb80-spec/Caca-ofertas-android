
name: Build Caca Ofertas APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Extract Android project
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          unzip -o caca-ofertas-android-projeto.zip -d extracted
          ls -la extracted
          find extracted -name gradlew -o -name build.gradle -o -name build.gradle.kts

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle --no-daemon -p extracted/caca-ofertas assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Caca-Ofertas-APK
          path: extracted/caca-ofertas/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
