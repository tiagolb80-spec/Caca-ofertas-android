name: Build Caça Ofertas APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Extract Android project
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          unzip -o caca-ofertas-android-projeto.zip -d extracted
          test -f extracted/caca-ofertas/settings.gradle
          test -f extracted/caca-ofertas/app/src/main/AndroidManifest.xml

      - name: Add in-app backend connection settings
        run: |
          cp overrides/config.js extracted/caca-ofertas/app/src/main/assets/config.js
          python - <<'PY'
          from pathlib import Path
          p = Path("extracted/caca-ofertas/app/src/main/assets/index.html")
          html = p.read_text(encoding="utf-8")
          marker = "</body>"
          if marker not in html:
              raise SystemExit("index.html sem fechamento body")
          html = html.replace(marker, '<script src="config.js"></script>\\n' + marker, 1)
          p.write_text(html, encoding="utf-8")
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon -p extracted/caca-ofertas assembleDebug

      - name: Verify APK exists
        run: test -s extracted/caca-ofertas/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Caca-Ofertas-APK
          path: extracted/caca-ofertas/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
